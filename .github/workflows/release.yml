# Builds, signs and publishes the APK as a GitHub Release on every v* tag.
# Manual run (Actions > Release APK > Run workflow): test build only, APK downloadable as an artifact.
# Needs the repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (see README).
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          name=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          code=$(sed -nE 's/^\s*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "versionName=$name versionCode=$code"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$name" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name (expected v$name)"
            exit 1
          fi

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!v}" ]]; then echo "::error::Missing secret $v"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/release/*-release.apk)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if grep -q "CN=Android Debug" <<< "$certs"; then
            echo "::error::APK is signed with the debug key"; exit 1
          fi
          fp=$(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]+).*/\1/p' <<< "$certs" | head -1)
          (cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "cert=$fp" >> "$GITHUB_OUTPUT"

      - name: Clean up key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Upload test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: distilla-${{ steps.version.outputs.name }}-test
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.version.outputs.code }}
          CERT: ${{ steps.apk.outputs.cert }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          {
            for lang in it-IT en-US; do
              f="fastlane/metadata/android/$lang/changelogs/$CODE.txt"
              if [[ -f "$f" ]]; then echo "### $lang"; cat "$f"; echo; fi
            done
            echo "---"
            echo "Signing certificate SHA-256: \`$CERT\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --title "Distilla ${GITHUB_REF_NAME#v}" --notes-file notes.md
